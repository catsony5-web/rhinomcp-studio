services:
  control:
    build: .
    command: ["serve", "--host", "0.0.0.0", "--port", "8765", "--public-url", "https://${MCP_DOMAIN:?Set MCP_DOMAIN in .env}", "--trust-proxy-headers"]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - control-state:/state
    networks: [control]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?Set MCP_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [control]
networks:
  control:
volumes:
  control-state:
  caddy-data:
  caddy-config:
