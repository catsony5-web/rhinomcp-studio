# Proposed paid deployment. Review the resources and price before creating them.
previews:
  generation: "off"
services:
  - type: web
    name: rhinomcp-studio-control
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    rootDir: management
    buildCommand: pip install -r requirements.txt
    startCommand: python render_start.py
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    numInstances: 1
    disk:
      name: rhinomcp-control-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: RHINOMCP_STATE_DIR
        value: /var/data/rhinomcp
      - key: RHINOMCP_BOOTSTRAP_PASSWORD
        sync: false
